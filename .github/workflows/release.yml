name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version to release (e.g. v0.4.1)'
        required: false
        type: string

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main

      - name: Install Dependencies
        run: bun install

      - name: Publish
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build Release Binaries
        run: bun run compile:all && bun run zip

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.11
        with:
          files: |
            bin/auth-linux-x64.zip
            bin/auth-linux-arm64.zip
            bin/auth-windows-x64.zip
            bin/auth-darwin-x64.zip
            bin/auth-darwin-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
